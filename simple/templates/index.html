<!DOCTYPE html>
<html>
<head>
    <title>Fruit Detection</title>
    <style>
        body { text-align: center; font-family: Arial; background-color: #4169E1;}
        h1 { color: white;font-size: 48px;}
        .logoiamsm {
            position: absolute;
            top: 0px;
            left: 10px;
            width: 360px;
            height: auto;
            z-index: 1000;   
        }
        .logotec {
            position: absolute;
            top: 40px;
            right: 10px;
            width: 360px;
            height: auto;
            z-index: 1000;   
        }
        .banner_1 {
            background-color: #10ad5f;
            color: white;
            font-size: 36px;
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
            margin: 20px auto;
            margin-right: 120px;
        }
        .banner_2 {
            background-color: #8B0000;
            color: white;
            font-size: 36px;
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
            margin: 20px auto;
        }
        .stream {
            border: 5px solid #333;
            border-radius: 10px;
        }
    
    </style>
</head>
<body>
    <img src="{{ url_for('static', filename='iamsm.png') }}" alt="IAMSM Logo" class="logoiamsm">
    <img src="{{ url_for('static', filename='tec.png') }}" alt="Tec Logo" class="logotec">
    <h1>Demostration of fruit detection model</h1>
    <div class="banner_1" id="unripe-blackberry-banner">Unripe Blackberry: <span id="count-unripeBlackberry"> <label id = "unblack">0 </label></span></div>
    <div class="banner_1" id="unripe-strawberry-banner">Unripe Strawberry: <span id="count-unripeStrawberry"> <label id = "unstraw">0 </label></span></div>
    <div class="banner_2" id="ripe-blackberry-banner">Ripe Blackberry: <span id="count-ripeBlackberry"> <label id = "black">0 </label></span></div> 
    <div class="banner_2" id="ripe-strawberry-banner">Ripe Strawberry: <span id="count-ripeStrawberry"> <label id = "straw">0 </label></span></div><br>
    <img src="{{url_for('video_feed')}}" width="960" height="720">

    <script>
       async function updateFruitCount() {
            try {
                const response = await
        fetch('/counts');
                const data = await
        response.json();
        
        document.getElementById('unblack').innerText = data.UnripeBlackberry;
        document.getElementById('unstraw').innerText = data.UnripeStrawberry;
        document.getElementById('black').innerText = data.RipeBlackberry;
        document.getElementById('straw').innerText = data.RipeStrawberry;
            }
        catch (error) {console.error('Error fetching data:', error);
        }
        }

        // Update every second
        setInterval(updateFruitCount, 100);
        updateFruitCount();
    </script>   
</body>
</html>
